services:
  - type: web
    name: clinical-research-variables-calculator
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: PRO_API_KEY
        generateValue: true
      - key: CONTACT_EMAIL
        sync: false
